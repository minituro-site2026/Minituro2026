<!--pizzaboss.html-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTuro – Hot Sauce Fractions</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}
body {
  background: #fff6e8;
  display: flex;
  justify-content: center;
}
/* Phone container */
.phone{
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:#fff6e8;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin:0 auto;
  padding:20px 16px 90px;
}
.boss{
  width:90%;
  max-width:320px;
  margin:10px 0;
}
.chat-container{
  width:100%;
  display:flex;
  justify-content:center;
  margin:15px 0;
}
.chat-bubble{
  background:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,0.05);
  padding:22px 14px 14px 14px;
  border-radius:18px;
  width:100%;
  max-width:320px;
  position:relative;
  font-weight:bold;
  text-align:center;
}
.chat-label{
  position:absolute;
  top:-10px;
  left:16px;
  background:#ff7a00;
  color:#fff;
  padding:4px 10px;
  border-radius:12px;
  font-size:11px;
  font-weight:600;
}
.answers{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}
.answer{
  background:#fff;
  width:120px;
  height:120px;
  box-shadow:0 10px 30px rgba(0,0,0,0.05);
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
  cursor:pointer;
  user-select:none;
  transition:0.3s;
  text-align:center;
  padding:10px;
}
.correct-answer{
  background:#4CAF50 !important;
  color:#fff;
}
.wrong-answer{
  background:#ff4d4d !important;
  color:#fff;
  animation:shake 0.4s;
}
@keyframes shake{
  0%{transform:translateX(0);}
  20%{transform:translateX(-8px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-6px);}
  80%{transform:translateX(6px);}
  100%{transform:translateX(0);}
}
.hearts{
  font-size:18px;
  margin:16px 0;
  font-weight:600;
  text-align:center;
}
/* Bottom nav */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:78px;
  background:#ff8c3a;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:70px;
  z-index:100;
}
.nav-item {
  flex: 1;
  text-decoration: none;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.footercons {
  width: 26px;
  margin-bottom: 4px;
}
/* Modal */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  z-index: 999;
}
.modal-content {
  background: white;
  width:min(90%,430px);
  border-radius:28px;
  padding:30px;
  text-align:center;
}
.modal-content h2{
  margin-bottom:10px;
}
.modal-content p{
  font-size:17px;
  margin-bottom:10px;
}
.modal-content button {
  margin-top: 10px;
  padding: 14px;
  width: 100%;
  border: none;
  border-radius: 10px;
  background: #ff7a00;
  color: #fff;
  font-size: 15px;
  font-weight:600;
  cursor: pointer;
}
/* SMALL PHONE */
@media (max-width:400px){
  .answer{ width:100px; height:100px; font-size:24px; }
  .chat-bubble{ font-size:14px; }
}
/* ===========================
   iPad / Tablet
=========================== */
@media (min-width:768px){
  .phone{
    max-width:650px;
    padding:30px 25px 110px;
  }
  .chat-bubble{ font-size:24px; max-width:460px; padding:28px 20px 20px; }
  .chat-label{ font-size:14px; padding:6px 14px; }
  .answer{ width:190px; height:190px; font-size:42px; }
  .hearts{ font-size:26px; }
  .modal-content{ width:min(520px,75%); max-width: 460px; padding: 48px; }
  .modal-content h2{ font-size:28px; }
  .modal-content p{ font-size: 22px; }
  .modal-content button{ padding: 18px; font-size: 20px; }
  .nav{ height:90px; gap:120px; }
  .nav-item{ flex: 0 1 auto; padding: 0 40px; font-size:16px; }
  .footercons{ width: 34px; }
}
</style>
</head>

<body>
<div class="phone">

  <img src="img/pizzatime.gif" class="boss">

  <div class="chat-container">
    <div class="chat-bubble">
      <div class="chat-label">Hot Sauce Fractions</div>
      Which is BIGGER?
    </div>
  </div>

  <div class="answers">
    <div class="answer" id="answer1" onclick="checkAnswer(0)"></div>
    <div class="answer" id="answer2" onclick="checkAnswer(1)"></div>
  </div>

  <div class="hearts" id="hearts"></div>

  <!-- MODAL -->
  <div class="modal" id="gameModal">
    <div class="modal-content" id="modalText"></div>
  </div>

  <div class="nav">
    <a href="home.html" class="nav-item">
      <img src="img/home.png" class="footercons">
      <span>Home</span>
    </a>
    <a href="info.html" class="nav-item">
      <img src="img/info.png" class="footercons">
      <span>Info</span>
    </a>
  </div>

</div>

<script>
let lives = 5;
let currentQuestion = 0;

const questions = [
  { options: ["1/2", "1/4"], correct: 0 },
  { options: ["one-fourth", "one-half"], correct: 1 },
  { options: ["2 Slices", "10 Slices"], correct: 0 },
  { options: ["1/3", "1/2"], correct: 1 },
  { options: ["1/8", "1/4"], correct: 1 }
];

function loadQuestion() {
  const q = questions[currentQuestion];
  document.getElementById("answer1").textContent = q.options[0];
  document.getElementById("answer2").textContent = q.options[1];
}

function updateHearts() {
  document.getElementById("hearts").textContent =
    "❤️".repeat(lives) + " (" + lives + " lives left)";
}

function checkAnswer(index) {
  const correctIndex = questions[currentQuestion].correct;
  const answers = document.querySelectorAll(".answer");

  if (index === correctIndex) {
    answers[index].classList.add("correct-answer");
    setTimeout(() => {
      answers[index].classList.remove("correct-answer");
      nextQuestion();
    }, 500);
  } else {
    answers[index].classList.add("wrong-answer");
    setTimeout(() => {
      answers[index].classList.remove("wrong-answer");
    }, 400);

    lives--;
    updateHearts();

    if (lives === 0) {
      setTimeout(showGameOver, 500);
    }
  }
}

function nextQuestion() {
  currentQuestion++;
  if (currentQuestion === questions.length) {
    showWin();
  } else {
    loadQuestion();
  }
}

function showGameOver() {
  const modal = document.getElementById("gameModal");
  const modalText = document.getElementById("modalText");

  modalText.innerHTML = `
    <h2>Game Over 😵</h2>
    <button onclick="restart()">Restart</button>
    <button onclick="goHome()">Home</button>
  `;
  modal.style.display = "flex";
}

function showWin() {
  const modal = document.getElementById("gameModal");
  const modalText = document.getElementById("modalText");

  modalText.innerHTML = `
    <h2>🔥 Boss Defeated! 🔥</h2>
    <p>You finished all 5 questions!</p>
    <button onclick="restart()">Play Again</button>
    <button onclick="goHome()">Home</button>
  `;
  modal.style.display = "flex";
}

function restart() {
  lives = 5;
  currentQuestion = 0;
  updateHearts();
  loadQuestion();
  document.getElementById("gameModal").style.display = "none";
}

function goHome() {
  window.location.href = "home.html";
}

loadQuestion();
updateHearts();
</script>

</body>
</html>
