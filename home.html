<!--home.html-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTuro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}
body {
  background: #fff6e8;
  display: flex;
  justify-content: center;
}
/* Phone container */
.phone{
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:#fff6e8;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin:0 auto;
  padding:20px 16px 90px;
}
/* Logo */
.logo{
  width:30%;
  display:block;
  margin:0 auto 10px;
}
.tagline{
  width:100%;
  text-align:center;
  color:#ff8c3a;
  font-size:18px;
  font-weight:700;
  margin:0 0 20px;
}
/* Grid */
.grid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:25px;
  max-width:500px;
  margin:0 auto;
  text-align:center;
}
.item h3{
  color:#ff8c3a;
  margin-bottom:0;
  min-height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:20px;
}
.circle{
  width:130px;
  height:130px;
  border-radius:50%;
  border:6px solid #ffb26b;
  margin:0 auto 10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:white;
  transition:0.3s ease all;
}
.circle:hover{
  border-color:#ff8c3a;
}
.circle:active{
  transform:scale(0.97);
}
.icons{
  width:90px;
  height:auto;
}
.bites{
  font-size:14px;
  color:#555;
}
/* Remove link underline */
a{
  text-decoration:none;
  display:inline-block;
}
/* Bottom nav */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:78px;
  background:#ff8c3a;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:70px;
  z-index:100;
}
.nav-item {
  flex: 1;
  text-decoration: none;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.nav-item:active{
  transform:scale(0.95);
}
.footercons {
  width: 26px;
  margin-bottom: 4px;
}
/* SMALL PHONE */
@media (max-width:400px){
  .circle{ width:110px; height:110px; }
  .icons{ width:75px; }
  .tagline{ font-size:16px; }
}
/* ===========================
   iPad / Tablet
=========================== */
@media (min-width:768px){
  .phone{
    max-width:650px;
    padding:30px 25px 110px;
  }
  .logo{ width:180px; margin-bottom:16px; }
  .tagline{ font-size:32px; margin-bottom:35px; }
  .grid{
    grid-template-columns:repeat(2,230px);
    justify-content:center;
    gap:40px;
  }
  .item h3{
    font-size:24px;
    line-height:30px;
    min-height:70px;
  }
  .circle{
    width:180px;
    height:180px;
    border-width:8px;
  }
  .icons{ width:120px; }
  .bites{ font-size:18px; }
  .nav{ height:90px; gap:120px; }
  .nav-item{ flex: 0 1 auto; padding: 0 40px; font-size:16px; }
  .footercons{ width: 36px; }
}
</style>
</head>

<body>
<div class="phone">

  <img src="img/minituro.png" class="logo" alt="MiniTuro Logo">
  <p class="tagline">Tap a Lesson to Start the Fun!</p>

  <div class="grid">

    <div class="item">
      <h3>Fractions</h3>
      <a href="fractions.html">
        <div class="circle">
          <img src="img/burger.gif" class="icons">
        </div>
      </a>
      <div class="bites">5 Short Lessons</div>
    </div>

    <div class="item">
      <h3>Coins & Bills</h3>
      <a href="money.html">
        <div class="circle">
          <img src="img/money.gif" class="icons">
        </div>
      </a>
      <div class="bites">6 Short Lessons</div>
    </div>

    <div class="item">
      <h3>Turns & Direction</h3>
      <a href="turn.html">
        <div class="circle">
          <img src="img/rotate.gif" class="icons">
        </div>
      </a>
      <div class="bites">6 Short Lessons</div>
    </div>

    <div class="item">
      <h3>Time</h3>
      <a href="time.html">
        <div class="circle">
          <img src="img/time.gif" class="icons">
        </div>
      </a>
      <div class="bites">7 Short Lessons</div>
    </div>

  </div>

  <div class="nav">
    <a href="home.html" class="nav-item">
      <img src="img/home.png" class="footercons">
      <span>Home</span>
    </a>
    <a href="info.html" class="nav-item">
      <img src="img/info.png" class="footercons">
      <span>Info</span>
    </a>
  </div>

</div>
</body>
</html>
