<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTuro Shorts</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  background: #fff6e8;
  display: flex;
  justify-content: center;
}

/* Phone container */
.phone {
  width: 390px;
  max-width: 390px;
  min-height: 100vh;
  background: #fff6e8;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-bottom: 80px;
  overflow-y: auto;
}

/* Logo */
.logo {
  width: 30%;
  display: block;
  margin: 20px auto;
}

/* Video wrapper */
.video-wrapper {
  position: relative;
  margin-top: 20px;
  width: 100%;
}

.video-wrapper video {
  width: 100%;
  height: auto;
  object-fit: cover;
}

/* Answer buttons overlay */
#answerBox {
  position: sticky;
  bottom: -220px;
  width: 100%;
  display: none;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap; /* THIS is important */
}

/* 2 buttons = side by side */
.quiz-btn {
  width: 110px;
  height: 110px;
  border-radius: 20px;
  background: #ff8c3a;
  color: white;
  border: none;
  font-weight: 700;
  font-size: 17px;
}

/* 4 buttons = grid look */
#answerBox .quiz-btn {
  flex: 1 1 40%; /* auto grid */
  max-width: 150px;
}

/* Caption */
.caption {
  margin-top: 12px;
  font-size: 17px;
}

/* Controls */
.controls {
  width: 100%;
  margin-top: 16px;
  display: flex;
  justify-content: space-between;
  padding: 0 20px;
}

button {
  background:#ff8c3a;
  border: none;
  color: white;
  padding: 8px 16px;
  margin-bottom: 10px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  position: sticky;
}

/* Bottom nav */
.nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 390px;
  height: 80px;
  background: #ff8c3a;
  display: flex;
  align-items: center;
  font-size: 15px;
}

.nav-item {
  flex: 1;
  text-decoration: none;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.footercons {
  width: 26px;
  margin-bottom: 4px;
}

/* Modal */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.modal-content {
  background: white;
  width:85%;
  border-radius:28px;
  padding:30px;
  text-align:center;
}

.modal-content p {
  font-size: 17px;
}

.modal-buttons {
  display: flex;
  gap: 10px;
  width: 100%;
  margin-top: 16px;
}

.modal-buttons button {
  flex: 1;
  padding: 14px;
  font-size: 15px;
}

.back-btn {
  flex: 1;
  background: #ccc;
  color: black;
}

.fight-btn {
  flex: 1;
  background: #ff6122;
  color: white;
}

/* ===========================
   iPad / Tablet
=========================== */

@media screen and (min-width:768px){

  /* Main container: keep it centered, don't stretch full width */
  .phone{
    width: 500px;
    max-width: 500px;
  }

  /* Logo */
  .logo{
    width: 160px;
  }

  /* Caption */
  .caption{
    font-size: 20px;
    margin-top: 16px;
  }

  /* Quiz answer buttons */
  .quiz-btn{
    width: 140px;
    height: 140px;
    border-radius: 24px;
    font-size: 20px;
  }

  #answerBox .quiz-btn{
    max-width: 180px;
  }

  #answerBox{
    gap: 18px;
  }

  /* Back / Next controls */
  .controls{
    margin-top: 22px;
    padding: 0 30px;
  }

  .controls button{
    padding: 12px 22px;
    font-size: 18px;
    border-radius: 14px;
  }

  /* Modal */
  .modal-content{
    width: 70%;
    max-width: 420px;
    padding: 40px;
  }

  .modal-content p{
    font-size: 20px;
  }

  .modal-buttons button{
    padding: 16px;
    font-size: 18px;
  }

  /* Footer nav */
  .nav{
    max-width: 700px;
    height: 100px;
    font-size: 18px;
    justify-content: space-evenly;
  }

  .nav-item{
    flex: 0 1 auto;
    padding: 0 40px;
  }

  .footercons{
    width: 34px;
    margin-bottom: 8px;
  }

}

</style>
</head>

<body>

<div class="phone">

  <img src="img/minituro.png" class="logo">

  <div class="video-wrapper">
    <video id="videoPlayer" controls>
      <source src="img/videos/V1_MP4_INTRO.mp4" type="video/mp4">
    </video>

    <!-- ANSWER BUTTONS -->
    <div id="answerBox">
    </div>
  </div>

  <div class="caption" id="captionText">
    🍕 Meet Fractions!
  </div>

  <div class="controls">
    <button onclick="prevVideo()">Back</button>
    <button onclick="nextVideo()">Next</button>
  </div>

  <!-- MODAL -->
  <div class="modal" id="gameModal">
    <div class="modal-content">
  <p>🎮 Are you ready for a challenge?</p>

  <div class="modal-buttons">
    <button class="back-btn" onclick="closeModal()">Back</button>
    <button class="fight-btn" onclick="goToBoss()">I'm Ready!</button>
  </div>
</div>
  </div>

  <div class="nav">
    <a href="home.html" class="nav-item">
      <img src="img/home.png" class="footercons">
      <span>Home</span>
    </a>
    <a href="info.html" class="nav-item">
      <img src="img/info.png" class="footercons">
      <span>Info</span>
    </a>
  </div>

</div>

<script>

const sequence = [
  { type: "video", url: "img/videos/V1_MP4_INTRO.mp4", caption: "🍕 Meet Fractions!" },

  {
  type: "quiz",
  url: "img/videos/V2_MP4_QUIZ.mp4",
  caption: "Watch and choose!",
  options: [
    { type: "image", value: "img/crushed.png" },
    { type: "image", value: "img/half.png" }
  ],
  correct: 1
},

  { type: "video", url: "img/videos/V3_MP4_ONEFOURTH.mp4", caption: "🍕 What is 1/4?" },

  { 
    type: "quiz",
    url: "img/videos/V4_MP4_QUIZ.mp4",
    caption: "Watch and choose!",
    options: [
  { type: "image", value: "img/one fourth.png" },
  { type: "image", value: "img/one half.png" },
  {type: "image", value: "img/one whole.png"}
  ],
    correct: 0
  },

  { type: "video", url: "img/videos/V5_MP4_SONG.mp4", caption: "🍕 1/2 vs 1/4?" }
];

let current = 0;

const player = document.getElementById("videoPlayer");
const caption = document.getElementById("captionText");
const answerBox = document.getElementById("answerBox");

const modal = document.getElementById("gameModal");

function updateScreen() {
  const item = sequence[current];

  player.src = item.url;
  caption.innerText = item.caption;

  if (item.type === "video") {
    player.play();   // autoplay lessons
  } else {
    player.pause();  // pause quizzes
  }

  if (item.type === "quiz") {
    answerBox.style.display = "flex";
    renderAnswers(item.options);
  } else {
    answerBox.style.display = "none";
  }
}

function answer(choice) {
  const item = sequence[current];

  if (choice === item.correct) {
    alert("Correct! 🎉");
    current++;
    updateScreen();
  } else {
    alert("Try again! ❌");
  }
}

function nextVideo() {
  const item = sequence[current];

  if (item.type === "quiz") {
    alert("Answer the question first! 🧠");
    return;
  }

  if (current < sequence.length - 1) {
    current++;
    updateScreen();
  } else {
    modal.style.display = "flex";
  }
}

function prevVideo() {
  if (current > 0) {
    current--;
    updateScreen();
  }
}

function renderAnswers(options) {
  answerBox.innerHTML = ""; // clear old buttons

  options.forEach((option, index) => {
    const btn = document.createElement("button");
    btn.className = "quiz-btn";
    btn.onclick = () => answer(index);

    // support BOTH text + image
    if (typeof option === "string") {
      btn.innerText = option;
    } else if (option.type === "image") {
      const img = document.createElement("img");
      img.src = option.value;
      img.style.width = "80%";
      img.style.height = "80%";
      img.style.objectFit = "contain";
      img.style.pointerEvents = "none";
      btn.appendChild(img);
    } else {
      btn.innerText = option.value;
    }

    answerBox.appendChild(btn);
  });
}

function closeModal() {
  modal.style.display = "none";
}

function goToBoss() {
  window.location.href = "boss.html";
}

</script>

</body>
</html>
