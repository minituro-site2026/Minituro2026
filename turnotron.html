<!--turnotron.html-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turn-O-Tron</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}
body {
  background: #fff6e8;
  display: flex;
  justify-content: center;
}
/* Phone container */
.phone{
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:#fff6e8;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  margin:0 auto;
  padding:20px 16px 90px;
}
.character{
  width:200px;
  margin-top:5px;
}
.chat-container{
  width:100%;
  display:flex;
  justify-content:center;
  margin:15px 0;
}
.chat-bubble{
  background:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,0.05);
  padding:22px 14px 14px 14px;
  border-radius:18px;
  width:100%;
  max-width:320px;
  position:relative;
  font-weight:bold;
  text-align:center;
}
.chat-label{
  position:absolute;
  top:-10px;
  left:16px;
  background:#ff7a00;
  color:#fff;
  padding:4px 10px;
  border-radius:12px;
  font-size:11px;
  font-weight:600;
}
#instruction{
  font-size:13px;
  font-weight:600;
  margin-bottom:10px;
  color:#555;
  text-align:center;
}
.buttons{
  width:100%;
  max-width:320px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.buttons button{
  padding:14px;
  border:none;
  border-radius:15px;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}
.buttons button:active{
  filter:brightness(0.75);
}
.direction{
  background:#1f78c8;
  color:white;
}
.turn{
  background:#f57c00;
  color:white;
}
.selected{
  filter:brightness(0.7);
}
.correct{
  background:#4caf50 !important;
  animation:fade 0.4s;
}
.wrong{
  background:#e53935 !important;
  animation:shake 0.4s;
}
@keyframes shake{
  0%{transform:translateX(0);}
  25%{transform:translateX(-5px);}
  50%{transform:translateX(5px);}
  75%{transform:translateX(-5px);}
  100%{transform:translateX(0);}
}
@keyframes fade{
  from{opacity:0.4;}
  to{opacity:1;}
}
.hearts{
  font-size:22px;
  margin:16px 0;
  font-weight:600;
  text-align:center;
}
.heart{
  display:inline-block;
  margin:2px;
}
.shakeHeart{
  animation:shake 0.4s;
}
/* Bottom nav */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:78px;
  background:#ff8c3a;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:70px;
  z-index:100;
}
.nav-item {
  flex: 1;
  text-decoration: none;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.footercons {
  width: 26px;
  margin-bottom: 4px;
}
/* Modal */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  z-index: 999;
}
.modal-content {
  background: white;
  width:min(90%,430px);
  border-radius:28px;
  padding:30px;
  text-align:center;
}
.modal-content h2{
  margin-bottom:10px;
}
.modal-content p{
  font-size:17px;
  margin-bottom:10px;
}
.modal-content button {
  margin-top: 10px;
  padding: 14px;
  width: 100%;
  border: none;
  border-radius: 10px;
  background: #ff7a00;
  color: #fff;
  font-size: 15px;
  font-weight:600;
  cursor: pointer;
}
/* SMALL PHONE */
@media (max-width:400px){
  .buttons button{ padding:12px; font-size:14px; }
  .chat-bubble{ font-size:14px; }
}
/* ===========================
   iPad / Tablet
=========================== */
@media (min-width:768px){
  .phone{
    max-width:650px;
    padding:30px 25px 110px;
  }
  .character{ width:260px; }
  .chat-bubble{ font-size:22px; max-width:460px; padding:28px 20px 20px; }
  .chat-label{ font-size:14px; padding:6px 14px; }
  #instruction{ font-size:16px; }
  .buttons{ max-width:460px; gap:16px; }
  .buttons button{ padding:18px; font-size:18px; }
  .hearts{ font-size:26px; }
  .modal-content{ width:min(520px,75%); max-width: 460px; padding: 48px; }
  .modal-content h2{ font-size:28px; }
  .modal-content p{ font-size: 22px; }
  .modal-content button{ padding: 18px; font-size: 20px; }
  .nav{ height:90px; gap:120px; }
  .nav-item{ flex: 0 1 auto; padding: 0 40px; font-size:16px; }
  .footercons{ width: 34px; }
}
</style>
</head>

<body>
<div class="phone">

  <img id="character" class="character" src="img/clockwise.gif">

  <div class="chat-container">
    <div class="chat-bubble">
      <div class="chat-label">Turn-O-Tron</div>
      Which direction is the arrow going?
    </div>
  </div>

  <div id="instruction"></div>

  <div class="buttons">
    <button class="direction" onclick="selectAnswer(this,'clockwise')">Clockwise</button>
    <button class="direction" onclick="selectAnswer(this,'counterclockwise')">Counter-Clockwise</button>
    <button class="turn" onclick="selectAnswer(this,'half')">Half Turn</button>
    <button class="turn" onclick="selectAnswer(this,'quarter')">Quarter Turn</button>
    <button class="turn" style="grid-column:1/3;" onclick="selectAnswer(this,'threequarter')">3-Quarter Turn</button>
  </div>

  <div class="hearts" id="hearts"></div>

  <!-- MODAL -->
  <div class="modal" id="gameModal">
    <div class="modal-content" id="modalText"></div>
  </div>

  <div class="nav">
    <a href="home.html" class="nav-item">
      <img src="img/home.png" class="footercons">
      <span>Home</span>
    </a>
    <a href="info.html" class="nav-item">
      <img src="img/info.png" class="footercons">
      <span>Info</span>
    </a>
  </div>

</div>

<script>
let lives = 7;
let selected = [];
let currentQuestion = 0;

const questions = [
  { img: "img/clockwise.gif", answer: ["clockwise"], type: "direction" },
  { img: "img/counterclockwise.gif", answer: ["counterclockwise"], type: "direction" },
  { img: "img/qtclock.gif", answer: ["clockwise", "quarter"], type: "full" },
  { img: "img/qtcount.gif", answer: ["counterclockwise", "quarter"], type: "full" },
  { img: "img/htclock.gif", answer: ["clockwise", "half"], type: "full" },
  { img: "img/htcount.gif", answer: ["counterclockwise", "half"], type: "full" },
  { img: "img/3qtclock.gif", answer: ["clockwise", "threequarter"], type: "full" },
  { img: "img/3qtcount.gif", answer: ["counterclockwise", "threequarter"], type: "full" },
  { img: "img/qtclock.gif", answer: ["clockwise", "quarter"], type: "full" },
  { img: "img/3qtcount.gif", answer: ["counterclockwise", "threequarter"], type: "full" }
];

function renderLives() {
  let html = "";
  for (let i = 0; i < lives; i++) {
    html += "<span class='heart'>❤️</span>";
  }
  document.getElementById("hearts").innerHTML = html;
}
renderLives();

function selectAnswer(button, value) {
  let needed = questions[currentQuestion].type === "direction" ? 1 : 2;
  if (selected.length >= needed) return;

  if (!selected.includes(value)) {
    selected.push(value);
    button.classList.add("selected");
  }

  if (selected.length === needed) {
    checkAnswer();
  }
}

function checkAnswer() {
  let correct = questions[currentQuestion].answer;

  let isCorrect =
    correct.every(ans => selected.includes(ans)) &&
    selected.length === correct.length;

  if (isCorrect) {
    document.querySelectorAll(".selected").forEach(btn => {
      btn.classList.add("correct");
    });
    setTimeout(nextQuestion, 600);
  } else {
    document.querySelectorAll(".selected").forEach(btn => {
      btn.classList.add("wrong");
    });
    loseLife();
    setTimeout(resetButtons, 600);
  }
}

function loseLife() {
  lives--;
  renderLives();
  document.querySelectorAll(".heart").forEach(h => {
    h.classList.add("shakeHeart");
  });

  if (lives <= 0) {
    showGameOver();
  }
}

function resetButtons() {
  selected = [];
  document.querySelectorAll(".buttons button").forEach(btn => {
    btn.classList.remove("selected", "wrong", "correct");
  });
}

function nextQuestion() {
  selected = [];
  document.querySelectorAll(".buttons button").forEach(btn => {
    btn.classList.remove("selected", "wrong", "correct");
  });

  currentQuestion++;

  if (currentQuestion >= questions.length) {
    showWin();
    return;
  }

  loadQuestion();
}

function loadQuestion() {
  let q = questions[currentQuestion];
  document.getElementById("character").src = q.img;

  let turnButtons = document.querySelectorAll(".turn");
  let instruction = document.getElementById("instruction");

  if (q.type === "direction") {
    turnButtons.forEach(btn => btn.style.display = "none");
    instruction.innerHTML = "";
  } else {
    turnButtons.forEach(btn => btn.style.display = "block");
    instruction.innerHTML = "Select two buttons";
  }
}

function showGameOver() {
  const modal = document.getElementById("gameModal");
  const modalText = document.getElementById("modalText");
  modalText.innerHTML = `
    <h2>Game Over</h2>
    <button onclick="restartGame()">Restart</button>
    <button onclick="window.location.href='turn.html'">Review Turns & Directions</button>
  `;
  modal.style.display = "flex";
}

function showWin() {
  const modal = document.getElementById("gameModal");
  const modalText = document.getElementById("modalText");
  modalText.innerHTML = `
    <h2>Boss Defeated</h2>
    <button onclick="window.location.href='home.html'">Back Home</button>
  `;
  modal.style.display = "flex";
}

function restartGame() {
  lives = 10;
  currentQuestion = 0;
  selected = [];
  renderLives();
  loadQuestion();
  document.getElementById("gameModal").style.display = "none";
}

loadQuestion();
</script>
</body>
</html>
