<!--turn.html-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniTuro Shorts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}
body {
  background: #fff6e8;
  display: flex;
  justify-content: center;
}
/* Phone container */
.phone{
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:#fff6e8;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin:0 auto;
  padding:20px 16px 90px;
}
/* Video wrapper */
.video-wrapper{
  width:100%;
  max-width:100%;
  position:relative;
  overflow:hidden;
  border-radius:22px;
}
.video-wrapper video{
  width:100%; display:block;
  border-radius:22px;
}
/* Answer buttons overlay */
#answerBox{
  position:absolute;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  display:none;
  flex-direction:column;
  align-items:center;
  gap:12px;
  z-index:20;
}
#choices{
  width:100%;
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
}
.quiz-btn{
  flex:1 1 calc(50% - 12px);
  max-width:170px;
  min-width:120px;
  aspect-ratio:1;
  border:none;
  border-radius:20px;
  background:#ff8c3a;
  color:white;
  font-weight:700;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:10px;
}
.quiz-btn img{
  width:80%;
  height:80%;
  object-fit:contain;
}
/* 3-4 buttons = grid look */
#answerBox .quiz-btn {
  flex: 1 1 40%; max-width: 150px;
}
/* Cancel (X) button — sits below the answer choices */
#cancelAnswerBtn{
  width:36px;
  height:36px;
  border:none;
  border-radius:50%;
  background:#00000080;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:6px;
}
/* Caption */
.caption{
  width:100%;
  text-align:center;
  color:#ff8c3a;
  font-size:18px;
  font-weight:600;
  margin:20px 0;
  padding:0 10px;
}
/* Controls - overlay near the bottom of the video */
.controls{
  position:absolute;
  left:0;
  right:0;
  bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 20px;
  gap: 30px;
}
.controls button{
  padding:12px 18px;
  font-size:16px;
  border-radius:14px;
}
button {
  background:#ff8c3a;
  border: none;
  color: white;
  padding: 8px 16px;
  margin-bottom: 10px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  position: sticky;
}
/* Answer button — sits between Back and Next, bounces gently */
#answerBtn{
  position: static;
  margin-bottom: 0;
  z-index: 11;
}
@keyframes answerBounce{
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}
#answerBtn.bounce{
  animation: answerBounce 1.1s ease-in-out infinite;
}
#answerBtn.bounce:active{
  animation-play-state: paused;
  transform: translateY(0);
}
/* Bottom nav */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:78px;
  background:#ff8c3a;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:70px;
  z-index:100;
}
.nav-item {
  flex: 1;
  text-decoration: none;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.footercons {
  width: 26px;
  margin-bottom: 4px;
}
/* Modal */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  z-index: 999;
}
.modal-content {
  background: white;
  width:min(90%,430px);
  border-radius:28px;
  padding:30px;
  text-align:center;
}
.modal-content p {
  font-size: 17px;
}
.modal-buttons {
  display: flex;
  gap: 10px;
  width: 100%;
  margin-top: 16px;
}
.modal-buttons button {
  flex: 1;
  padding: 14px;
  font-size: 15px;
}
.back-btn {
  flex: 1;
  background: #ccc;
  color: black;
}
.fight-btn {
  flex: 1;
  background: #ff6122;
  color: white;
}
/* SMALL PHONE */
@media (max-width:400px){
  .quiz-btn{ min-width:100px; }
  .caption{ font-size:16px; }
  .controls button{ font-size:14px; padding:8px 14px; }
}
/* ===========================
   iPad / Tablet
=========================== */
@media (min-width:768px){
  .phone{
    max-width:650px;
    padding:30px 25px 110px;
  }
  .caption{ font-size:24px; }
  .quiz-btn{ max-width:220px; min-width:180px; }
  #answerBox .quiz-btn{ max-width: 180px; }
  #answerBox{ bottom: 90px; }
  .controls{ bottom: 16px; padding: 0 30px; }
  .controls button{ font-size:18px; padding:14px 22px; }
  .modal-content{ width:min(480px,70%); max-width: 420px; padding: 40px; }
  .modal-content p{ font-size: 20px; }
  .modal-buttons button{ padding: 16px; font-size: 18px; }
  .nav{ height:90px; gap:120px; }
  .nav-item{ flex: 0 1 auto; padding: 0 40px; }
  .footercons{ width: 34px; }
}
</style>
</head>
<body>
<div class="phone">
  <div class="video-wrapper">
    <video
      id="videoPlayer"
      autoplay
      muted
      playsinline
      controls>
      <source src="img/videos/V12_MP4_CLOCKVSCOUNT.mp4" type="video/mp4">
    </video>

    <!-- ANSWER BUTTONS -->
    <div id="answerBox">
      <div id="choices"></div>
      <button id="cancelAnswerBtn" onclick="hideAnswers()">✕</button>
    </div>

    <!-- BACK / NEXT overlay near bottom of video -->
    <div class="controls">
      <button onclick="prevVideo()">Back</button>
      <button id="answerBtn" onclick="showAnswers()" style="display:none;">Answer</button>
      <button onclick="nextVideo()">Next</button>
    </div>
  </div>

  <div class="caption" id="captionText">
    Turns and Directions
  </div>

  <!-- MODAL -->
  <div class="modal" id="gameModal">
    <div class="modal-content">
      <p>Are you ready for a challenge?</p>
      <div class="modal-buttons">
        <button class="back-btn" onclick="closeModal()">Back</button>
        <button class="fight-btn" onclick="goToBoss()">I'm Ready!</button>
      </div>
    </div>
  </div>

  <div class="nav">
    <a href="home.html" class="nav-item">
      <img src="img/home.png" class="footercons">
      <span>Home</span>
    </a>
    <a href="info.html" class="nav-item">
      <img src="img/info.png" class="footercons">
      <span>Info</span>
    </a>
  </div>
</div>

<script>
const sequence = [
  { type: "video", url: "img/videos/V12_MP4_CLOCKVSCOUNT.mp4", caption: "Turns and Directions" },
  {
    type: "quiz",
    url: "img/videos/V13_MP4_CLOCKVSCOUNT_QUIZ.mp4",
    caption: "Watch and choose!",
    options: [
      { type: "text", value: "Counter-Clockwise" },
      { type: "text", value: "Clockwise" }
    ],
    correct: 0
  },
  { type: "video", url: "img/videos/V14_MP4_HALFVSQUART.mp4", caption: "Half Turn vs Quarter Turn" },
  {
    type: "quiz",
    url: "img/videos/V15_MP4_HALFVSQUART_QUIZ.mp4",
    caption: "Watch and choose!",
    options: [
      { type: "image", value: "img/quartcounter.png" },
      { type: "image", value: "img/halfcounterclock.png" },
      { type: "image", value: "img/halfclock.png" }
    ],
    correct: 1
  },
  { type: "video", url: "img/videos/V16_MP4_3PTURNFULLTURN.mp4", caption: "3-Point Turn vs Full Turn" },
  {
    type: "quiz",
    url: "img/videos/V17_MP4_QUIZ.mp4",
    caption: "Watch and choose!",
    options: [
      { type: "image", value: "img/quartclock.png" },
      { type: "image", value: "img/3pointclock.png" },
      { type: "image", value: "img/3pointcounterclock.png" }
    ],
    correct: 2
  }
];

let current = 0;
const player = document.getElementById("videoPlayer");
const caption = document.getElementById("captionText");
const answerBox = document.getElementById("answerBox");
const answerBtn = document.getElementById("answerBtn");
const modal = document.getElementById("gameModal");

function updateScreen() {
  const item = sequence[current];
  player.src = item.url;
  caption.innerText = item.caption;
  player.load();
  player.muted = false; // required for autoplay on most browsers
  player.playsInline = true; // iPhone support
  player.play().catch(err => {
    console.log("Autoplay blocked:", err);
  });

  if (item.type === "video") {
    player.play(); // autoplay lessons
    answerBox.style.display = "none";
    answerBtn.style.display = "none";
    answerBtn.classList.remove("bounce");
  } else {
    player.load();
    player.muted = false;
    player.playsInline = true;
    player.play().catch(err => {
      console.log(err);
    });
    renderAnswers(item.options);
    answerBox.style.display = "none";
    // Show Answer button immediately
    answerBtn.style.display = "inline-block";
    answerBtn.classList.add("bounce");
  }
}

// Reveal the answer choices, hide the Answer button
function showAnswers() {
  answerBox.style.display = "flex";
  answerBtn.style.display = "none";
  answerBtn.classList.remove("bounce");
}

// Cancel out of the answer choices, bring back the bouncing Answer button
function hideAnswers() {
  answerBox.style.display = "none";
  answerBtn.style.display = "inline-block";
  answerBtn.classList.add("bounce");
}

function answer(choice) {
  const item = sequence[current];
  if (choice === item.correct) {
    alert("Correct! 🎉");
    if (current === sequence.length - 1) {
      modal.style.display = "flex";
      return;
    }
    current++;
    updateScreen();
  } else {
    alert("Try again! ❌");
  }
}

function nextVideo() {
  const item = sequence[current];
  if (item.type === "quiz") {
    alert("Answer the question first! 🧠");
    return;
  }
  if (current < sequence.length - 1) {
    current++;
    updateScreen();
  } else {
    modal.style.display = "flex";
  }
}

function prevVideo() {
  if (current > 0) {
    current--;
    updateScreen();
  }
}

function renderAnswers(options) {
  const choices = document.getElementById("choices");
  choices.innerHTML = "";
  options.forEach((option, index) => {
    const btn = document.createElement("button");
    btn.className = "quiz-btn";
    btn.onclick = () => answer(index);
    if (typeof option === "string") {
      btn.innerText = option;
    } else if (option.type === "image") {
      const img = document.createElement("img");
      img.src = option.value;
      img.style.width = "80%";
      img.style.height = "80%";
      img.style.objectFit = "contain";
      img.style.pointerEvents = "none";
      btn.appendChild(img);
    } else {
      btn.innerText = option.value;
    }
    choices.appendChild(btn);
  });
}

function closeModal() {
  modal.style.display = "none";
}

function goToBoss() {
  window.location.href = "turnotron.html";
}

updateScreen();
</script>
</body>
</html>
