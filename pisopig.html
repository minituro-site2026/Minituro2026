<!--pisopig.html-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sir Piso Pig</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}
body {
  background: #fff6e8;
  display: flex;
  justify-content: center;
}
/* Phone container */
.phone{
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:#fff6e8;
  display:flex;
  flex-direction:column;
  align-items:center;
  margin:0 auto;
  padding:20px 16px 90px;
}
.balance{
  font-weight:600;
  margin-top:5px;
  text-align:center;
}
.character{
  width:180px;
  margin-top:10px;
}
.nameTag{
  background:#f57c00;
  color:white;
  padding:8px 18px;
  border-radius:20px;
  font-weight:600;
  margin-top:10px;
  box-shadow:0 4px 10px rgba(0,0,0,0.15);
}
.dialogue{
  background:#fff;
  width:100%;
  max-width:320px;
  padding:15px;
  border-radius:20px;
  margin-top:10px;
  text-align:center;
  min-height:70px;
  box-shadow:0 6px 15px rgba(0,0,0,0.15);
}
/* Calculator */
.calculator{
  margin-top:20px;
  background:#ff7a00;
  padding:15px;
  border-radius:25px;
  width:100%;
  max-width:320px;
  box-shadow:0 8px 20px rgba(0,0,0,0.25);
}
.display{
  background:#6b2e00;
  color:white;
  font-size:24px;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
}
.keys{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.calculator button{
  border:none;
  border-radius:12px;
  padding:15px;
  font-size:18px;
  cursor:pointer;
  font-weight:600;
}
.num{ background:#ffa64d; }
.action{ background:#ff944d; }
.enter{
  background:#e65100;
  color:white;
  grid-column: span 2;
}
.hearts{
  font-size:22px;
  margin:16px 0;
  font-weight:600;
  text-align:center;
}
/* Bottom nav */
.nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:78px;
  background:#ff8c3a;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:70px;
  z-index:100;
}
.nav-item {
  flex: 1;
  text-decoration: none;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.footercons {
  width: 26px;
  margin-bottom: 4px;
}
/* Modal */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.6);
  justify-content: center;
  align-items: center;
  z-index: 999;
}
.modal-content {
  background: white;
  width:min(90%,430px);
  border-radius:28px;
  padding:30px;
  text-align:center;
}
.modal-content h2{
  margin-bottom:10px;
}
.modal-content p{
  font-size:17px;
  margin-bottom:10px;
}
.modal-content button {
  margin-top: 10px;
  padding: 14px;
  width: 100%;
  border: none;
  border-radius: 10px;
  background: #ff7a00;
  color: #fff;
  font-size: 15px;
  font-weight:600;
  cursor: pointer;
}
/* SMALL PHONE */
@media (max-width:400px){
  .calculator button{ padding:12px; font-size:16px; }
  .dialogue{ font-size:14px; }
}
/* ===========================
   iPad / Tablet
=========================== */
@media (min-width:768px){
  .phone{
    max-width:650px;
    padding:30px 25px 110px;
  }
  .character{ width:240px; }
  .nameTag{ font-size:18px; padding:10px 22px; }
  .dialogue{ font-size:20px; max-width:460px; padding:22px; }
  .calculator{ max-width:420px; padding:20px; }
  .display{ font-size:30px; padding:16px; }
  .calculator button{ padding:20px; font-size:22px; }
  .hearts{ font-size:26px; }
  .modal-content{ width:min(520px,75%); max-width: 460px; padding: 48px; }
  .modal-content h2{ font-size:28px; }
  .modal-content p{ font-size: 22px; }
  .modal-content button{ padding: 18px; font-size: 20px; }
  .nav{ height:90px; gap:120px; }
  .nav-item{ flex: 0 1 auto; padding: 0 40px; font-size:16px; }
  .footercons{ width: 34px; }
}
</style>
</head>

<body>
<div class="phone">

  <div id="balance" class="balance" style="display:none;">
    Sir Piso Pig's Balance: ₱100
  </div>
  <img src="img/pisopig.gif" class="character">
  <div class="nameTag">Sir Piso Pig</div>
  <div class="dialogue" id="dialogue">Loading...</div>

  <div class="calculator">
    <div class="display" id="display">₱ </div>
    <div class="keys">
      <button class="num" onclick="press(7)">7</button>
      <button class="num" onclick="press(8)">8</button>
      <button class="num" onclick="press(9)">9</button>
      <button class="action" onclick="backspace()">⌫</button>
      <button class="num" onclick="press(4)">4</button>
      <button class="num" onclick="press(5)">5</button>
      <button class="num" onclick="press(6)">6</button>
      <button class="num" onclick="press(0)">0</button>
      <button class="num" onclick="press(1)">1</button>
      <button class="num" onclick="press(2)">2</button>
      <button class="num" onclick="press(3)">3</button>
      <button class="enter" onclick="submit()">Enter</button>
    </div>
  </div>

  <div class="hearts" id="hearts">❤️❤️❤️❤️❤️❤️❤️❤️❤️❤️ (lives left)</div>

  <!-- MODAL -->
  <div class="modal" id="gameModal">
    <div class="modal-content" id="modalText"></div>
  </div>

  <div class="nav">
    <a href="home.html" class="nav-item">
      <img src="img/home.png" class="footercons">
      <span>Home</span>
    </a>
    <a href="info.html" class="nav-item">
      <img src="img/info.png" class="footercons">
      <span>Info</span>
    </a>
  </div>

</div>

<script>
let phase2Started = false;
let balance = 100;
let lives = 10;
let index = 0;
let input = "";

const questions = [
  { type: "add", text: "I want 2 breads. ₱10 each. How much will I pay?", answer: 20 },
  { type: "add", text: "I want 5 coffee. ₱6 each. How much will I pay?", answer: 30 },
  { type: "add", text: "I want 8 water. ₱7 each. How much will I pay?", answer: 56 },
  { type: "add", text: "I want 9 soda. ₱8 each. How much will I pay?", answer: 72 },
  { type: "add", text: "I want 10 chips. ₱9 each. How much will I pay?", answer: 90 },
  { type: "sub", text: "I have ₱100. I bought bread worth ₱15. How much do I have left?", answer: 85 },
  { type: "sub", text: "I bought coffee worth ₱20. How much do I have left?", answer: 65 },
  { type: "sub", text: "I bought water worth ₱18. How much do I have left?", answer: 47 },
  { type: "sub", text: "I bought soda worth ₱22. How much do I have left?", answer: 25 },
  { type: "sub", text: "I bought chips worth ₱25. How much do I have left?", answer: 0 }
];

function loadQuestion() {
  let q = questions[index];
  document.getElementById("dialogue").innerText = q.text;

  if (q.type === "sub") {
    document.getElementById("balance").style.display = "block";
    document.getElementById("balance").innerText =
      "Sir Piso Pig's Balance: ₱" + balance;

    // Show Phase 2 popup only once
    if (!phase2Started) {
      phase2Started = true;
      showPhase2Popup();
    }
  } else {
    document.getElementById("balance").style.display = "none";
  }

  input = "";
  updateDisplay();
}

function press(n) {
  input += n;
  updateDisplay();
}

function backspace() {
  input = input.slice(0, -1);
  updateDisplay();
}

function updateDisplay() {
  document.getElementById("display").innerText = "₱ " + input;
}

function submit() {
  if (parseInt(input) === questions[index].answer) {
    if (questions[index].type === "sub") {
      balance = questions[index].answer;
    }
    index++;
    if (index >= questions.length) {
      showBossDefeated();
    } else {
      loadQuestion();
    }
  } else {
    lives--;
    document.getElementById("hearts").innerText = "❤️".repeat(lives) + " (lives left)";
    if (lives <= 0) {
      showGameOver();
    }
  }
}

function showPhase2Popup() {
  const modal = document.getElementById("gameModal");
  const modalText = document.getElementById("modalText");
  modalText.innerHTML = `
    <h2>Phase 2: <br>Spending Time!</h2>
    <p><b>Spend Sir Piso Pig's Money!</b><br>
    Use the power of subtraction!</p>
    <button onclick="closePopup()">Let's Go!</button>
  `;
  modal.style.display = "flex";
}

function closePopup() {
  document.getElementById("gameModal").style.display = "none";
}

function showGameOver() {
  const modal = document.getElementById("gameModal");
  const modalText = document.getElementById("modalText");
  modalText.innerHTML = `
    <h2>Game Over!</h2>
    <button onclick="location.reload()">Retry</button>
    <button onclick="location.href='money.html'">Review Coins & Bills</button>
  `;
  modal.style.display = "flex";
}

function showBossDefeated() {
  const modal = document.getElementById("gameModal");
  const modalText = document.getElementById("modalText");
  modalText.innerHTML = `
    <h2>Boss Defeated!</h2>
    <button onclick="location.reload()">Play Again</button>
    <button onclick="location.href='home.html'">Home Page</button>
  `;
  modal.style.display = "flex";
}

loadQuestion();
</script>
</body>
</html>
